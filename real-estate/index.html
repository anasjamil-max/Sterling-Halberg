    /* Workflow section layout */
    .workflow-section {
      width: 100%;
      max-width: none;
      margin-top: 2rem;
      display: flex;
      justify-content: flex-end;
      padding: 0 0 0 2rem;
      box-sizing: border-box;
      overflow: visible;
    }

    .workflow-container {
      display: flex;
      align-items: center;
      width: 100%;
      max-width: 800px;
      margin-left: auto;
    }

    .node-user {
      position: relative;
      width: 96px;
      height: 96px;
      background: transparent;
      border: 1px solid rgba(115, 115, 115, 0.35);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .node-user::after {
      content: '';
      position: absolute;
      right: -1px;
      top: 50%;
      transform: translateY(-50%);
      width: 1px;
      height: 48px;
      background: linear-gradient(to bottom, rgba(115, 115, 115, 0.35) 0%, #000000 50%, rgba(115, 115, 115, 0.35) 100%);
      pointer-events: none;
      z-index: 10;
    }

    .node-signature {
      width: 68px;
      height: 68px;
      background: transparent;
      border: 1px solid #000000;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .connector-line {
      flex-grow: 1;
      height: 1px;
      background: #000000;
      min-width: 32px;
    }

    .connector-arrow {
      display: flex;
      align-items: center;
      flex-grow: 1;
      min-width: 36px;
      position: relative;
    }

    .connector-arrow::before {
      content: '';
      width: 100%;
      height: 1px;
      background: #000000;
    }

    .connector-arrow::after {
      content: '';
      position: absolute;
      right: -2px;
      width: 0;
      height: 0;
      border-top: 4px solid transparent;
      border-bottom: 4px solid transparent;
      border-left: 6px solid #000000;
      z-index: 11;
    }

    .node-browser {
      position: relative;
      background: transparent;
      border: 1px solid rgba(115, 115, 115, 0.35);
      border-radius: 24px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      width: 420px;
      height: 280px;
      box-sizing: border-box;
      flex-shrink: 0;
    }

    .node-browser::before {
      content: '';
      position: absolute;
      left: -1px;
      top: 50%;
      transform: translateY(-50%);
      width: 1px;
      height: 48px;
      background: linear-gradient(to bottom, rgba(115, 115, 115, 0.35) 0%, #000000 50%, rgba(115, 115, 115, 0.35) 100%);
      pointer-events: none;
      z-index: 10;
    }

    .node-browser span {
      background: rgba(115, 115, 115, 0.45) !important;
    }

    /* Responsive adjustments */
    @media (max-width: 1024px) {
      .workflow-section {
        justify-content: center;
        padding: 0 1rem;
      }

      .workflow-container {
        margin: 0 auto;
        justify-content: center;
        overflow-x: auto;
        padding-bottom: 1.5rem;
        -webkit-overflow-scrolling: touch;
        max-width: 100%;
      }
    }

    @media (max-width: 480px) {

      }

        padding: 0 1rem;
      }
    }
  </style>

  <div class="custom-cursor"></div>

  <script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>
  <script>
    const lenis = new Lenis({
      duration: 1.5,
      easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
      wheelMultiplier: 1.2,
      smoothWheel: true,
      smoothTouch: false,
    });

    function raf(time) {
      lenis.raf(time);
      requestAnimationFrame(raf);
    }
    requestAnimationFrame(raf);

    const cursor = document.querySelector('.custom-cursor');
    let mouseX = 0, mouseY = 0;
    let currentX = 0, currentY = 0;
    const speed = 0.15;

    function initCursor() {
      if (window.innerWidth > 480) {
        window.addEventListener('mousemove', e => {
          mouseX = e.clientX;
          mouseY = e.clientY;
        });

        function animateCursor() {
          currentX += (mouseX - currentX) * speed;
          currentY += (mouseY - currentY) * speed;
          cursor.style.transform = `translate(${currentX}px, ${currentY}px) translate(-50%, -50%)`;
          requestAnimationFrame(animateCursor);
        }
        animateCursor();
      }
    }

    initCursor();
    window.addEventListener('resize', initCursor);
  </script>
