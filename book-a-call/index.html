<body>

  <main class="page-wrapper">

    <nav style="position: absolute; top: 2rem; left: 2rem; z-index: 10;">
      <a href="/real-estate" class="btn btn-glass" style="padding: 0 1.5rem; height: 36px; font-size: 0.8rem;">← BACK</a>
    </nav>

    <section class="contact-hero" style="padding-bottom: 1rem;">
      <h1 style="line-height: 0.9; letter-spacing: -3px;">Book a Call</h1>
    </section>

    <section class="contact-container">
      <form class="contact-form" id="contact-form" action="https://api.web3forms.com/submit" method="POST" data-redirect="https://cal.com/anas-j" style="margin-top: 1.5rem;">
        <input type="hidden" name="access_key" value="5c451fa3-54f3-4d69-a670-6deae47e4652">
        <input type="hidden" name="redirect" value="https://cal.com/anas-j">
        <input type="checkbox" name="botcheck" class="hidden" style="display: none;">
        
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your Full Name" required>
        </div>

        <div class="form-group">
          <label for="suburb">Suburb</label>
          <input type="text" id="suburb" name="suburb" placeholder="Your Suburb / Region" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="hello@example.com" required>
        </div>

        <div class="form-group">
          <label for="website">Website</label>
          <input type="text" id="website" name="website" placeholder="youragency.com.au">
        </div>

        <div class="form-group full-width">
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="Tell us about your agency, current marketing, or goals..." required></textarea>
        </div>

        <div class="submit-container">
          <button type="submit" class="btn btn-glass">SEND MESSAGE</button>
        </div>
      </form>
    </section>
